<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Profile Card Generator</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <div class="container">

        <h1>User Profile Card Generator</h1>
        <p>Create your own profile card</p>

        <form action="/create-profile" method="POST">

            <input
                type="text"
                name="name"
                placeholder="Enter your name"
                required
            >

            <textarea
                name="bio"
                placeholder="Write your bio"
                required
            ></textarea>

            <input
                type="url"
                name="image_url"
                placeholder="Enter image URL"
                required
            >

            <button type="submit">Generate Profile</button>

        </form>

    </div>

</body>
</html>
